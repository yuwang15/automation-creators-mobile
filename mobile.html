<script>
/* 整机按窗口高度缩放：一屏看全，不用上下滚页面；手机上直接打开（≤430 宽）不缩放。 */
(function () {
  var stage = document.querySelector('.stage'), phone = document.querySelector('.phone'), frame = phone.querySelector('iframe');
  function safeArea() {
    if (!frame.contentDocument) return;
    var root = frame.contentDocument.documentElement;
    if (innerWidth > 430) {
      root.style.setProperty('--mock-safe-top', '54px');
      root.style.setProperty('--mock-safe-bottom', '34px');
    } else {
      root.style.removeProperty('--mock-safe-top');
      root.style.removeProperty('--mock-safe-bottom');
    }
  }
  frame.addEventListener('load', safeArea);
  function fit() {
    safeArea();
    if (innerWidth <= 430) { phone.style.transform = ''; stage.style.width = stage.style.height = ''; return; }
    var s = Math.min(1, (innerHeight - 110) / 872, (innerWidth - 48) / 413);
    phone.style.transform = 'scale(' + s + ')';
    stage.style.width = 393 * s + 'px';
    stage.style.height = 852 * s + 'px';
  }
  addEventListener('resize', fit); fit();
})();
</script>
